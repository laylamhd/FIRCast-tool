<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Month · Insights · FIRCast</title>
  <meta name="description" content="One month of FIRCast statistics: traffic, sector load, model accuracy and recommendations.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <!-- Fonts: Bricolage Grotesque for headlines and big numbers, Manrope for everything else -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles: shared base first, then the Insights pages' own file -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/insights.css">
</head>

<body>
  <!-- Skip link: hidden until a keyboard user presses Tab, then jumps straight to the content -->
  <a class="skip" href="#main">Skip to content</a>

  <!-- Navigation bar. Insights stays highlighted on the month pages too -->
  <nav class="nav" aria-label="Main">
    <a class="brand" href="index.html" aria-label="FIRCast home">
      <img class="brand-logo" src="assets/images/logo.png" width="39" height="32" alt="">
      <span class="brand-name">FIRCast</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="map.html">Map</a>
      <a class="nav-link" href="insights.html" aria-current="page">Insights</a>
    </div>
  </nav>

  <!-- Faded radar sweep behind the whole page (js/shared/radar-background.js) -->
  <canvas id="radar" aria-hidden="true"></canvas>

  <main id="main" class="month-page">
    <!-- Top row: back to the timeline, the month's name, previous / next month -->
    <div class="month-top">
      <a class="btn btn-sm btn-ghost" href="insights.html" id="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6 L9 12 L15 18"/></svg>
        All months
      </a>
      <div class="month-title">
        <h1 id="month-name">Month</h1>
        <p class="month-sub" id="month-sub"></p>
      </div>
      <div class="month-step">
        <a class="step-btn" id="prev-month" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6 L9 12 L15 18"/></svg></a>
        <a class="step-btn" id="next-month" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6 L15 12 L9 18"/></svg></a>
      </div>
    </div>

    <!-- Four cards, filled by js/insights/month.js -->
    <div class="stat-grid" id="stat-grid">
      <section class="stat-card" aria-labelledby="t-traffic">
        <h2 id="t-traffic">Traffic</h2>
        <div class="tiles" id="tiles-traffic"></div>
        <p class="chart-title">Flights per day</p>
        <div class="chart" id="chart-daily"></div>
      </section>
      <section class="stat-card" aria-labelledby="t-sectors">
        <h2 id="t-sectors">Sectors</h2>
        <div class="tiles" id="tiles-sectors"></div>
        <p class="chart-title">Hours above the high limit, by sector</p>
        <div class="chart" id="chart-high"></div>
      </section>
      <section class="stat-card" aria-labelledby="t-model">
        <h2 id="t-model">Model accuracy</h2>
        <div class="tiles" id="tiles-model"></div>
        <p class="chart-title">Average error, by how far ahead the model looks <span>(lower is better)</span></p>
        <div class="chart" id="chart-mae"></div>
      </section>
      <section class="stat-card" aria-labelledby="t-recs">
        <h2 id="t-recs">Recommendations</h2>
        <div class="tiles" id="tiles-recs"></div>
        <p class="chart-title">What supervisors decided</p>
        <div class="chart" id="chart-decisions"></div>
        <p class="chart-title">Why they overrode</p>
        <div class="chart" id="chart-reasons"></div>
      </section>
    </div>
    <p class="month-error" id="month-error" hidden></p>
  </main>

  <!-- Scripts, in order: sample data, the API wrapper, the charts, the page, then shared bits -->
  <script src="data/sample-insights.js"></script>
  <script src="js/insights/insights-api.js"></script>
  <script src="js/insights/charts.js"></script>
  <script src="js/insights/month.js"></script>
  <script src="js/shared/radar-background.js"></script>
  <script src="js/shared/nav.js"></script>
</body>
</html>
